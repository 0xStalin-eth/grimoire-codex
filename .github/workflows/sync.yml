name: Sync upstream
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: grimoire-upstream-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == '0xStalin-eth/grimoire-codex'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Retrieve and generate (upstream is read-only)
        run: python3 scripts/sync.py
      - name: Validate generated skills
        run: python3 scripts/validate.py
      - name: Test synchronization and benchmark tooling
        run: python3 -m unittest discover -s tests -v
      - name: Open or update downstream PR
        run: python3 scripts/open_sync_pr.py
        env:
          GH_TOKEN: ${{ secrets.SYNC_PR_TOKEN || github.token }}
